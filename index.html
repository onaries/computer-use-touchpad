<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
        <title>Computer Use Demo</title>
        <meta name="permissions-policy" content="fullscreen=*" />
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #1a1a1a;
            }
            .container {
                position: fixed;
                top: var(--viewport-top, 0px);
                left: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: var(--viewport-height, 100dvh);
                width: 100%;
            }
            .workspace {
                display: flex;
                flex: 1;
                min-height: 0;
            }
            .left {
                flex: 1;
                border: none;
                min-width: 0;
                height: 100%;
            }
            .left.hidden {
                display: none;
            }
            .right {
                flex: 2;
                border: none;
                min-width: 0;
                height: 100%;
            }
            .toolbar {
                position: relative;
                flex-shrink: 0;
                padding: 6px;
                z-index: 1000;
            }
            .toolbar-actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
            #toggleTools { display: none; }
            .touchpad-controls {
                display: flex;
                flex-direction: column;
                flex: 0 0 200px;
                box-sizing: border-box;
                min-height: 0;
                padding: 6px;
                gap: 6px;
                font-family: sans-serif;
            }
            .touchpad-controls[hidden] { display: none; }
            .touchpad-surface {
                position: relative;
                display: grid;
                place-items: center;
                flex: 1;
                min-height: 0;
                overflow: hidden;
                border: 1px solid #555;
                border-radius: 10px;
                background: #252a32;
                color: #b8c1ce;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            .touchpad-surface[data-enabled="false"] { background: #202124; }
            .touchpad-hint { pointer-events: none; font-size: 13px; text-align: center; }
            .touchpad-buttons { display: flex; flex: 0 0 48px; gap: 6px; }
            .touchpad-buttons .btn { flex: 1; font-size: 15px; touch-action: manipulation; }
            .btn:disabled { opacity: 0.45; cursor: default; }
            #enablePadControl { position: absolute; }
            .btn {
                padding: 6px 12px;
                background: #222;
                color: #fff;
                text-decoration: none;
                border: 1px solid #555;
                border-radius: 4px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }
            .btn-primary {
                background: #0284c7;
                border-color: #0369a1;
            }
            @media (max-width: 768px) {
                .container.pad-mode .workspace {
                    flex: 0 1 62.5vw;
                    max-height: calc((var(--viewport-height, 100dvh) - 44px) * 0.5);
                }
                .touchpad-controls { flex: 1; }
                .container.pad-mode .left:not(.hidden) + .right { flex: 1; min-height: 0; }
                .toolbar { text-align: right; }
                #toggleTools { display: inline-block; min-height: 32px; }
                .toolbar-actions { display: none; }
                .toolbar.expanded .toolbar-actions {
                    display: flex;
                    position: absolute;
                    top: 100%;
                    right: 6px;
                    left: 6px;
                    padding: 8px;
                    background: #1a1a1a;
                    border: 1px solid #555;
                }
                .workspace { flex-direction: column; }
                .left { flex: 1; min-height: 0; }
                .right {
                    flex: none;
                    width: 100%;
                    /* shortcut: shared desktop is 1280x800; update ratio if desktop dimensions change. */
                    height: min(100%, 62.5vw);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="toolbar">
                <button id="toggleTools" class="btn" aria-expanded="false" aria-controls="toolbar-actions">☰ 도구</button>
                <div id="toolbar-actions" class="toolbar-actions">
                    <button id="toggleSidebar" class="btn">◀ 메뉴 숨기기</button>
                    <a id="openDevTools" href="/debug.html" target="_blank" rel="noopener" class="btn btn-primary">🛠️ Remote DevTools</a>
                    <button id="toggleViewOnly" class="btn">Toggle Screen Control (Off)</button>
                    <button id="toggleInputMode" class="btn" aria-pressed="false" title="아래 패드로 이동, 버튼으로 클릭">입력: 터치</button>
                </div>
            </div>
            <div class="workspace">
                <iframe
                    id="left-pane"
                    class="left"
                    title="메뉴"
                    allow="fullscreen"
                ></iframe>
                <iframe
                    id="vnc"
                    class="right"
                    title="원격 데스크톱"
                    allow="fullscreen"
                ></iframe>
            </div>
            <section id="touchpadControls" class="touchpad-controls" aria-label="터치패드 조작" hidden>
                <div id="touchpadSurface" class="touchpad-surface" role="group" aria-label="커서 이동 터치패드" data-enabled="false">
                    <span id="touchpadHint" class="touchpad-hint"></span>
                    <button id="enablePadControl" type="button" class="btn btn-primary">화면 제어 켜기</button>
                </div>
                <div class="touchpad-buttons">
                    <button id="padLeftClick" type="button" class="btn" disabled>좌클릭</button>
                    <button id="padRightClick" type="button" class="btn" disabled>우클릭</button>
                </div>
            </section>
            <script>
                const host = window.location.hostname;
                const leftPane = document.getElementById("left-pane");
                const toggleSidebarBtn = document.getElementById("toggleSidebar");
                const toolbar = document.querySelector(".toolbar");
                const toggleToolsBtn = document.getElementById("toggleTools");
                const vncIframe = document.getElementById("vnc");
                const inputModeBtn = document.getElementById("toggleInputMode");
                const savedInputMode = localStorage.getItem("cu_input_mode");
                let inputMode = ["touch", "touchpad"].includes(savedInputMode) ? savedInputMode
                    : window.matchMedia("(max-width: 768px)").matches ? "touchpad" : "touch";
                let padEnabled = false;
                const pad = document.getElementById("touchpadSurface");
                const pointers = new Map();
                function setPadEnabled(enabled) {
                    const next = enabled && inputMode === "touchpad";
                    if (next === padEnabled) return;
                    padEnabled = next;
                    if (!padEnabled) pointers.clear();
                    pad.dataset.enabled = String(padEnabled);
                    document.getElementById("padLeftClick").disabled = !padEnabled;
                    document.getElementById("padRightClick").disabled = !padEnabled;
                    document.getElementById("enablePadControl").hidden = padEnabled;
                    document.getElementById("touchpadHint").innerText = padEnabled
                        ? "쓸어서 커서 이동 · 두 손가락 스크롤\n클릭은 아래 버튼" : "";
                }
                function sendPadInput(body) {
                    if (padEnabled) vncIframe.contentWindow.postMessage({ type: "cu-pad-input", ...body }, new URL(vncIframe.src).origin);
                }
                function center() {
                    const points = [...pointers.values()];
                    return { x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
                        y: points.reduce((sum, p) => sum + p.y, 0) / points.length };
                }
                pad.addEventListener("pointerdown", function (event) {
                    if (!padEnabled || event.target.closest("button") || (event.pointerType === "mouse" && event.button !== 0)) return;
                    event.preventDefault();
                    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
                    pad.setPointerCapture(event.pointerId);
                });
                pad.addEventListener("pointermove", function (event) {
                    if (!padEnabled || !pointers.has(event.pointerId)) return;
                    event.preventDefault();
                    const before = center();
                    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
                    const after = center();
                    if (pointers.size <= 2) sendPadInput({ action: pointers.size === 2 ? "scroll" : "move",
                        dx: after.x - before.x, dy: after.y - before.y });
                });
                for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
                    pad.addEventListener(type, event => { pointers.delete(event.pointerId); });
                }
                pad.addEventListener("contextmenu", event => event.preventDefault());
                window.addEventListener("blur", () => pointers.clear());
                document.getElementById("padLeftClick").addEventListener("click", () => sendPadInput({ action: "click", button: 0 }));
                document.getElementById("padRightClick").addEventListener("click", () => sendPadInput({ action: "click", button: 2 }));
                document.getElementById("enablePadControl").addEventListener("click", () => document.getElementById("toggleViewOnly").click());

                function sendInputMode() {
                    vncIframe.contentWindow.postMessage({ type: "cu-input-mode", mode: inputMode }, new URL(vncIframe.src).origin);
                }
                function renderInputMode() {
                    inputModeBtn.innerText = inputMode === "touchpad" ? "입력: 터치패드" : "입력: 터치";
                    inputModeBtn.setAttribute("aria-pressed", String(inputMode === "touchpad"));
                    document.querySelector(".container").classList.toggle("pad-mode", inputMode === "touchpad");
                    document.getElementById("touchpadControls").hidden = inputMode !== "touchpad";
                }
                inputModeBtn.addEventListener("click", function () {
                    inputMode = inputMode === "touchpad" ? "touch" : "touchpad";
                    localStorage.setItem("cu_input_mode", inputMode);
                    pointers.clear();
                    setPadEnabled(false);
                    renderInputMode();
                    sendInputMode();
                });
                vncIframe.addEventListener("load", function () { setPadEnabled(false); sendInputMode(); });
                window.addEventListener("message", function (event) {
                    if (event.source !== vncIframe.contentWindow || event.origin !== new URL(vncIframe.src).origin) return;
                    if (event.data?.type === "cu-input-ready") sendInputMode();
                    else if (event.data?.type === "cu-pad-status") setPadEnabled(event.data.enabled === true);
                });
                renderInputMode();

                function syncViewport() {
                    const viewport = window.visualViewport;
                    document.documentElement.style.setProperty("--viewport-height", `${viewport?.height ?? window.innerHeight}px`);
                    document.documentElement.style.setProperty("--viewport-top", `${viewport?.offsetTop ?? 0}px`);
                }
                window.visualViewport?.addEventListener("resize", syncViewport);
                window.visualViewport?.addEventListener("scroll", syncViewport);
                window.addEventListener("resize", syncViewport);
                syncViewport();

                toggleToolsBtn.addEventListener("click", function () {
                    const expanded = toolbar.classList.toggle("expanded");
                    toggleToolsBtn.setAttribute("aria-expanded", String(expanded));
                });

                leftPane.src = "http://" + host + ":8501";
                document.getElementById("vnc").src = "http://" + host + ":6080/vnc.html?view_only=1&autoconnect=1&resize=scale";

                function setSidebarHidden(hidden) {
                    leftPane.classList.toggle("hidden", hidden);
                    toggleSidebarBtn.innerText = hidden ? "▶ 메뉴 보이기" : "◀ 메뉴 숨기기";
                    localStorage.setItem("cu_hide_sidebar", hidden ? "1" : "0");
                }

                const params = new URLSearchParams(window.location.search);
                const sidebar = params.get("sidebar");
                const savedSidebar = localStorage.getItem("cu_hide_sidebar");
                if (sidebar === "0" || (sidebar !== "1" && (savedSidebar === "1"
                    || (savedSidebar === null && window.matchMedia("(max-width: 768px)").matches)))) {
                    setSidebarHidden(true);
                }

                toggleSidebarBtn.addEventListener("click", function () {
                    setSidebarHidden(!leftPane.classList.contains("hidden"));
                });

                document
                    .getElementById("toggleViewOnly")
                    .addEventListener("click", function () {
                        var vncIframe = document.getElementById("vnc");
                        var button = document.getElementById("toggleViewOnly");
                        var currentSrc = vncIframe.src;
                        setPadEnabled(false);
                        if (currentSrc.includes("view_only=1")) {
                            vncIframe.src = currentSrc.replace(
                                "view_only=1",
                                "view_only=0",
                            );
                            button.innerText = "Toggle Screen Control (On)";
                        } else {
                            vncIframe.src = currentSrc.replace(
                                "view_only=0",
                                "view_only=1",
                            );
                            button.innerText = "Toggle Screen Control (Off)";
                        }
                    });
            </script>
        </div>
    </body>
</html>
